<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Query Ticket Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: #f0f0f0;
      border-radius: 4px;
    }
    textarea::-webkit-scrollbar-thumb {
      background: #cbd5e0;
      border-radius: 4px;
    }
    textarea::-webkit-scrollbar-thumb:hover {
      background: #a0aec0;
    }
  </style>
 
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-100 min-h-screen flex items-center justify-center py-12 px-4">
   <a href="/society" class="fixed top-4 left-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-200">
  Home
</a>
  <form action="/api/rms/createticket" method="post" class="bg-white w-full max-w-lg rounded-2xl shadow-2xl p-10 border border-blue-200">
    <h1 class="text-3xl font-bold text-blue-800 mb-8 text-center">Submit a Service Ticket</h1>

    <!-- Category -->
    <div class="mb-6">
      <label for="category" class="block text-sm font-semibold text-blue-800 mb-2">Category</label>
      <select id="category" name="category" required class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
        <option value="">Select a category</option>
        <option value="electricity">Electricity</option>
        <option value="plumbing">Plumbing</option>
        <option value="gas">Gas</option>
        <option value="internet">Internet</option>
        <option value="security">Security</option>
        <option value="cleaning">Cleaning</option>
        <option value="other">Other</option>
        <!-- ✅ Extended options -->
        <option value="maintenance">General Maintenance</option>
        <option value="noise">Noise Complaint</option>
        <option value="waste">Waste Disposal</option>
        <option value="parking">Parking Issue</option>
        <option value="lift">Lift Problem</option>
        <option value="water">Water Supply</option>
        <option value="pest">Pest Control</option>
        <option value="visitor">Visitor Management</option>
        <option value="lighting">Common Area Lighting</option>
        <option value="amenities">Amenity Booking Issue</option>
      </select>
    </div>

    <!-- Date Available -->
    <div class="mb-6">
      <label for="date-available" class="block text-sm font-semibold text-blue-800 mb-2">Preferred Date for Service</label>
      <input type="date" id="date-available" name="date_available" required class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
    </div>

    <!-- Contact Number -->
    <div class="mb-6">
      <label for="contact-no" class="block text-sm font-semibold text-blue-800 mb-2">Contact Number</label>
      <input type="tel" id="contact-no" name="contact_no" required placeholder="e.g., +91 9876543210" pattern="[0-9+ ]{8,15}" title="Please enter a valid phone number (8–15 digits, includes +, spaces)" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600">
    </div>

    <!-- Description -->
    <div class="mb-8">
      <label for="description" class="block text-sm font-semibold text-blue-800 mb-2">Description of Query</label>
      <textarea id="description" name="description" rows="5" required placeholder="Please provide a detailed description of your query..." class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-600 resize-y"></textarea>
    </div>

    <!-- Submit -->
    <a href="showtickets_page.html" target="_blank">
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-2">
        Submit Ticket
      </button>
    </a>
  </form>
</body>
</html>
