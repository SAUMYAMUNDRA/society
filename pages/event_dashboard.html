<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Event Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 p-6 font-sans">

  <div class="max-w-3xl mx-auto text-center">
    
    <!-- Title -->
    <h1 class="text-4xl font-bold text-blue-900 mb-4">🎯 Event Dashboard</h1>
    <p class="text-blue-700 text-lg mb-10">Manage your event participation with ease</p>

    <!-- Buttons -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
      
      <!-- Upcoming Events Button -->
      <a href="/list">
  <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow">
    View Upcoming Events
  </button>
</a>
      
      <!-- Past Events Button -->
     <a href="/past-events">
  <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow">
    View Past Events
  </button>
</a>

    </div>
  </div>

</body>
</html>
