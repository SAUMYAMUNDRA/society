<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="flex flex-col md:flex-row bg-white rounded-lg shadow-lg max-w-3xl w-full overflow-hidden">
    
    <!-- Left Half: Image -->
    <div class="md:w-1/2 hidden md:flex justify-center items-center bg-gray-200">
      <img src="/images/reg image.png" alt="Form Banner" class="w-full h-full object-cover" />
    </div>

    <!-- Right Half: Form -->
    <div class="w-full md:w-1/2 p-8">
      <h2 class="text-2xl font-bold mb-6 text-center" id="header">Login To Get Started </h2>

      <form id="simpleForm">
        <div class="mb-4">
          <label class="block mb-1 font-medium">Society Email</label>
          <input type="email" id="email" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Password</label>
          <input type="password" id="password" required class="w-full p-2 border rounded" />
        </div>

        <div class="flex justify-end mt-6">
          <button type="submit" class="bg-blue-500 text-white px-6 py-2 mx-20 rounded hover:bg-blue-600">
            Submit
          </button>
          <button >
           <a class="text-blue-800 font-bold "> forgot password?</a>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    

    document.getElementById("simpleForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please fill all the details");
        return;
      }

    fetch("/api/secretary/login", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
  },
  body: JSON.stringify({ email, password }),
})
  .then(async (res) => {
    const data = await res.json();

    if (!res.ok) {
      
      alert(data.error || "Login failed");
      return;
    }

    
    alert(data.message);
   
  })
  .catch((err) => {
    alert("Something went wrong");
    console.error(err);
  });
});
  </script>
</body>
</html>
