<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post Notice</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center">

  <form action="/api/notice" method="POST" class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-700">Post a Notice</h2>

    <div>
      <label for="title" class="block mb-1 font-medium text-gray-600">Title</label>
      <input type="text" name="title" id="title" required
             class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label for="content" class="block mb-1 font-medium text-gray-600">Content</label>
      <textarea name="content" id="content" rows="6" required
                class="w-full border border-gray-300 rounded-md p-2 resize-none focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>

    <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-300">
      Submit Notice
    </button>
  </form>

</body>
</html>
