<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post Notice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

  <style>
    body::-webkit-scrollbar {
      width: 8px;
    }
    body::-webkit-scrollbar-thumb {
      background: #4a5568;
      border-radius: 4px;
    }
    body::-webkit-scrollbar-thumb:hover {
      background: #2d3748;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 to-indigo-200 flex items-center justify-center px-4 py-10 font-sans">

  <form action="/api/notice" method="POST"
        class="bg-white w-full max-w-xl p-8 rounded-3xl shadow-2xl border border-gray-200 space-y-6">

    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-blue-800">📢 Post a Notice</h2>
      <p class="text-gray-500 text-sm mt-1">Let residents know what's important</p>
    </div>

    <!-- Title -->
    <div>
      <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">Notice Title <span class="text-red-500">*</span></label>
      <input type="text" name="title" id="title" placeholder="Meeting Reminder..." required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <!-- Content -->
    <div>
      <label for="content" class="block text-sm font-semibold text-gray-700 mb-1">Notice Content <span class="text-red-500">*</span></label>
      <textarea name="content" id="content" rows="6" placeholder="Write your notice here..." required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg shadow-md transition-all duration-300">
        📬 Submit Notice
      </button>
    </div>

  </form>
<script>
  window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const success = urlParams.get('success');

  if (success === 'true') {
    Toastify({
      text: "✅ Notice published successfully!",
      duration: 3000,
      gravity: "top",
      position: "center",
      backgroundColor: "#22c55e", // green
      stopOnFocus: true,
    }).showToast();

    // Remove query param so it doesn't show again on refresh
    const url = new URL(window.location);
    url.searchParams.delete("success");
    window.history.replaceState({}, document.title, url);
  }
});
</script>
</body>
</html>
