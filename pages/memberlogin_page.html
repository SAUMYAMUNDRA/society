<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>member login</title>
  <script src="https://cdn.tailwindcss.com"></script>
 <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="flex flex-col md:flex-row bg-white rounded-lg shadow-lg max-w-3xl w-full overflow-hidden">
    <!-- Left Half: Image -->
    <div class="md:w-1/2 hidden md:flex justify-center items-center bg-gray-200">
      <img src="/images/reg image.png" alt="Form Banner" class="w-full h-full object-cover" />
    </div>

    <!-- Right Half: Form -->
    <div class="w-full md:w-1/2 p-8">
      <h2 class="text-2xl font-bold mb-6 text-center" id="header">Login To Get Started </h2>

      <form id="simpleForm" method="post" action="/api/member/login">
        <div class="mb-4">
          <label class="block mb-1 font-medium">PhoneNo</label>
          <input type="tel" id="tel" name="PhoneNo" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium" >Password</label>
          <input type="password" id="password" name="password" required class="w-full p-2 border rounded" />
        </div>

        <div class="flex justify-end mt-6">
          <button type="submit" class="bg-blue-500 text-white px-6 py-2 mx-20 rounded hover:bg-blue-600">
            Submit
          </button>
          <button >
           <a class="text-blue-800 font-bold "> forgot password?</a>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const success = urlParams.get('success');

  if (success === 'false') {
    Toastify({
      text: "Invalid email or password ",
      duration: 3000,
      gravity: "top",
      position: "center",
      backgroundColor: "#ef4444", // red
      stopOnFocus: true,
    }).showToast();

    // Remove query param so it doesn't show again on refresh
    const url = new URL(window.location);
    url.searchParams.delete("success");
    window.history.replaceState({}, document.title, url);
  }
});
</script>
 
</body>
</html>
