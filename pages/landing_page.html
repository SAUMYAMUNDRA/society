<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/output.css" rel="stylesheet">

    <title>Document</title>
</head>

<body class="bg-[#f6f9fe]">
    <div class="flex h-screen">



        <div class="flex flex-col-reverse md:flex-row mt-20 items-center px-4 md:px-16 py-10 bg-[#f6f9fe]">
            <div class="w-full md:w-1/2 sm:mb-20 mb-10 md:mb-0">
                <img src="/images/society.png" alt="Society" class="w-full h-auto object-contain">
            </div>

            <div class="w-full md:w-1/2 mt-10 md:mt-0 md:ml-8 text-center md:text-left">
                <h1 class="font-bold text-3xl md:text-4xl">One Place<br>Society Management System.</h1>
                <p class="mt-6 text-lg md:text-xl">All your headaches are now solved in just one website</p>

                <div class="relative mt-2">
                    <form id="societyForm">
                        <input type="text" id="societyInput"
                            placeholder="                               Enter Your Society Name to Get Started"
                            class="w-full p-4 pr-24  rounded-full shadow-md bg-white text-gray-700 focus:outline-none" />
                        <button type="submit"
  id="goBtn"
                            class="absolute right-1 top-1/2 -translate-y-1/2 bg-blue-500 text-white px-4 py-4 rounded-full hover:bg-blue-600 active:scale-95 transition">
                            Go
                        </button>
                    </form>
                </div>


            </div>




        </div>

    </div>
</body>
<script>
  const form = document.getElementById("societyForm");
  const input = document.getElementById("societyInput");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const societyName = input.value.trim();

    if (!societyName) {
      alert("Please enter your society name.");
      return;
    }

    const encodedName = encodeURIComponent(societyName);
    window.location.href = `/register?society=${encodedName}`;
  });
</script>



</html>
