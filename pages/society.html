<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive CSS Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f9fe] flex items-center justify-center">

  <div class="grid gap-2 w-full min-h-screen   p-1 rounded shadow-lg
              grid-cols-1 md:grid-cols-4
              ">
    <!-- Navbar -->
<div class="bg-white md:row-span-1 sm:row-span-1 md:col-span-4 col-span-2 border-2 text-center py-2 font-bold shadow-xl relative">
    <div class="absolute left-2 top-1/2 -translate-y-1/2 w-13 h-16 border-1 rounded-full overflow-hidden">
        <img src="../public/images/reg image.png"   alt="Your Logo" class="object-cover w-full h-full">
    </div>
    <div class="absolute right-10 translate-y-3 border-2 bg-yellow-400">
        <button>logout </button>
    </div>
    <div class="ml-12">SOCIET NAME</div>

</div>
    <!-- Sidebar -->
<div class="bg-white md:row-span-9 sm:row-span-10 md:col-span-3 col-span-2 border-2 text-center py-2 font-bold shadow-xl flex flex-col md:flex-row">
    <div class="w-full md:w-3/4 p-4 border-b-2 md:border-b-0 md:border-r-2 border-gray-200">
        <h3 class="text-lg font-semibold mb-2">Public Notice</h3>
        <p>This is the larger section for important notices.</p>
    </div>

    <div class="w-full md:w-1/4 p-4">
        <h3 class="text-md font-semibold mb-2">Private Notice</h3>
        <ul class="list-disc list-inside text-left">
            <li>Link 1</li>
            <li>Link 2</li>
        </ul>
    </div>
</div>
    <!-- Main -->
    <div class="bg-white col-span-2 sm:row-span-10 col-span-1 md:row-span-9 border-2  shadow-xl   md:col-span-1 text-center py-4 font-bold">EVENTS</div>

    <!-- Content Boxes -->
   

    <!-- Footer -->
    <div class="bg-white col-span-1 md:col-span-2 border-2 md:row-span-2 shadow-xl col-span-2  text-center py-2 font-bold">MANAGEMENT SYSTEM </div>
     <div class="bg-white col-span-1 md:col-span-2 border-2 shadow-xl md:row-span-2 col-span-2   text-center py-2 font-bold">AUTHORITY CONTACT NO</div>
  </div>

</body>
</html>
