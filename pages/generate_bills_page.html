<!-- pages/generate_bills_page.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Bills</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
  <form action="/fms/generate-bills" method="POST" class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-blue-800 mb-6">Generate Maintenance Bills</h2>

    <label class="block text-sm font-medium text-gray-700 mb-1">Month (e.g. June 2025)</label>
    <input name="month" required type="text" placeholder="Month"
           class="w-full border border-gray-300 rounded px-3 py-2 mb-4" />

    <label class="block text-sm font-medium text-gray-700 mb-1">Amount (₹)</label>
    <input name="amount" required type="number" placeholder="Amount"
           class="w-full border border-gray-300 rounded px-3 py-2 mb-4" />

    <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
    <input name="dueDate" required type="date"
           class="w-full border border-gray-300 rounded px-3 py-2 mb-6" />

    <button type="submit"
            class="w-full bg-blue-600 text-white font-semibold py-2 rounded hover:bg-blue-700 transition">
      Generate Bills
    </button>
  </form>
</body>
</html>
