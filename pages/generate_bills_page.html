<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Generate Bills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body::-webkit-scrollbar {
      width: 8px;
    }
    body::-webkit-scrollbar-thumb {
      background: #4a5568;
      border-radius: 4px;
    }
    body::-webkit-scrollbar-thumb:hover {
      background: #2d3748;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center px-4 font-sans">
   <a href="/society" class="fixed top-4 left-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-200">
  Home
</a>
  <form action="/fms/generate-bills" method="POST"
        class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl border border-gray-200 space-y-6">

    <div class="text-center">
      <h2 class="text-3xl font-extrabold text-blue-800">🧾 Generate Maintenance Bills</h2>
      <p class="text-gray-500 text-sm mt-1">Enter monthly bill details below</p>
    </div>

    <!-- Month -->
    <div>
      <label for="month" class="block text-sm font-semibold text-gray-700 mb-1">Month <span class="text-red-500">*</span></label>
      <input name="month" id="month" type="text" required placeholder="e.g. July 2025"
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <!-- Amount -->
    <div>
      <label for="amount" class="block text-sm font-semibold text-gray-700 mb-1">Amount (₹) <span class="text-red-500">*</span></label>
      <input name="amount" id="amount" type="number" required placeholder="Enter amount"
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <!-- Due Date -->
    <div>
      <label for="dueDate" class="block text-sm font-semibold text-gray-700 mb-1">Due Date <span class="text-red-500">*</span></label>
      <input name="dueDate" id="dueDate" type="date" required
             class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg shadow-md transition-all duration-300">
        💸 Generate Bills
      </button>
    </div>

  </form>

</body>
</html>
