<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Ticket Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for textarea if content overflows */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e0; /* Light gray */
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #a0aec0; /* Slightly darker gray */
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <!-- Form Container -->
    <form class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md border border-gray-200" action="/api/rms/createticket" method="post">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Generate New Ticket</h2>

        <!-- Category Field -->
        <div class="mb-5">
            <label for="category" class="block text-gray-700 text-sm font-medium mb-2">Category</label>
            <select id="category" name="category" class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 ease-in-out bg-gray-50 text-gray-800">
                <option value="">Select a category</option>
                <option value="electricity">Electricity</option>
                <option value="plumbing">Plumbing</option>
                <option value="gas">Gas</option>
                <option value="internet">Internet</option>
                <option value="security">Security</option>
                <option value="cleaning">Cleaning</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Date Available Field -->
        <div class="mb-5">
            <label for="date-available" class="block text-gray-700 text-sm font-medium mb-2">Preferred Date for Service</label>
            <input type="date" id="date-available" name="date_available" class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 ease-in-out bg-gray-50 text-gray-800">
        </div>

        <!-- Contact Number Field -->
        <div class="mb-5">
            <label for="contact-no" class="block text-gray-700 text-sm font-medium mb-2">Contact Number</label>
            <input type="tel" id="contact-no" name="contact_no" placeholder="e.g., +91 9876543210" class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 ease-in-out bg-gray-50 text-gray-800" pattern="[0-9+ ]{8,15}" title="Please enter a valid phone number (8-15 digits, includes +, spaces)">
        </div>

        <!-- Description Textarea -->
        <div class="mb-6">
            <label for="description" class="block text-gray-700 text-sm font-medium mb-2">Description of Query</label>
            <textarea id="description" name="description" rows="5" placeholder="Please provide a detailed description of your query..." class="block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200 ease-in-out bg-gray-50 text-gray-800 resize-y"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-md shadow-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-300 ease-in-out transform hover:scale-105">
            Submit Ticket
        </button>
    </form>
</body>
</html>
