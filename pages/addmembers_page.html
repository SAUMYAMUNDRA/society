<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Add Member</title>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
  <div class="bg-white shadow-xl rounded-xl p-8 w-full max-w-md border border-gray-200">
    <h2 class="text-2xl font-bold text-center text-indigo-700 mb-6">Add New Member</h2>
    <form action="/api/addmember" method="post" class="space-y-4">
      
      <!-- Mobile Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
        <input type="text" name="phone" placeholder="Enter mobile number"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" required />
      </div>
      
      <!-- Flat Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Flat Number</label>
        <input type="text" name="flatNo" placeholder="Enter flat number"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400" required />
      </div>

      <!-- Role Selection -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
        <select name="role" required
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-400">
          <option value="member">Member</option>
          <option value="worker">Worker</option>
        </select>
      </div>

      <!-- Submit -->
      <div class="pt-4">
        <button type="submit"
          class="w-full bg-indigo-600 text-white py-2 rounded-md hover:bg-indigo-700 transition duration-200">
          Add Member
        </button>
      </div>
    </form>
  </div>
</body>
</html>
