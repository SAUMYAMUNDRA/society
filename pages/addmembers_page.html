<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Member</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body::-webkit-scrollbar {
      width: 8px;
    }
    body::-webkit-scrollbar-thumb {
      background: #4a5568;
      border-radius: 4px;
    }
    body::-webkit-scrollbar-thumb:hover {
      background: #2d3748;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-indigo-200 min-h-screen flex items-center justify-center px-4 font-sans">
  <a href="/society" class="fixed top-4 left-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md transition duration-200">
    Home
  </a>
  <div class="bg-white border border-gray-200 shadow-2xl rounded-3xl w-full max-w-2xl p-10">
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-extrabold text-blue-800">👤 Add New Member</h2>
      <p class="text-gray-500 text-sm mt-2">Please fill in the details below to register a member or worker</p>
    </div>

    <form action="/api/addmember" method="POST" class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- Full Name -->
      <div class="col-span-2">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
        <input type="text" name="name" placeholder="John Doe"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <!-- Age -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Age</label>
        <input type="number" name="age" placeholder="25"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- DOB -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Date of Birth</label>
        <input type="date" name="dob"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
        <input type="email" name="email" placeholder="example@mail.com"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <!-- Mobile Number -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Mobile Number <span class="text-red-500">*</span></label>
        <input type="text" name="phone" placeholder="9876543210"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <!-- Address -->
      <div class="col-span-2">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Address</label>
        <input type="text" name="address" placeholder="123, Street Name, City"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Flat No -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">
          Flat Number <span id="flatLabel" class="text-red-500">*</span>
        </label>
        <input type="text" name="flatNo" id="flatNo" placeholder="A-102"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
        <input type="password" name="password" placeholder="Set initial password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
      </div>

      <!-- Role -->
      <div class="col-span-2">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Select Role</label>
        <select name="role" id="role"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
          <option value="member">👤 Member</option>
          <option value="worker">🛠️ Worker</option>
        </select>
      </div>

      <!-- Submit -->
      <div class="col-span-2 pt-4">
        <button type="submit"
          class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-indigo-700 transition-all shadow-md">
          ➕ Add Member
        </button>
      </div>
    </form>
  </div>

  <script>
    const roleSelect = document.getElementById("role");
    const flatNoInput = document.getElementById("flatNo");
    const flatLabel = document.getElementById("flatLabel");

    roleSelect.addEventListener("change", () => {
      if (roleSelect.value === "worker") {
        flatNoInput.removeAttribute("required");
        flatLabel.classList.add("hidden");
      } else {
        flatNoInput.setAttribute("required", "required");
        flatLabel.classList.remove("hidden");
      }
    });

    // Trigger once on page load in case worker is pre-selected
    document.addEventListener("DOMContentLoaded", () => {
      const event = new Event("change");
      roleSelect.dispatchEvent(event);
    });
  </script>
</body>
</html>
