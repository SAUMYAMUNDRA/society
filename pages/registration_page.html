<!-- public/secretary_registration.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secretary Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow-md rounded-2xl p-8 w-full max-w-2xl">
    <h2 class="text-2xl font-bold text-blue-700 mb-6 text-center">Secretary Registration</h2>
    <form id="registrationForm" class="space-y-6">

      <!-- Step 1 -->
      <div class="step" id="step-1">
        <div class="mb-4">
          <label class="block mb-1 font-medium">Full Name</label>
          <input type="text" name="name" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Phone Number</label>
          <input type="tel" name="phone" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Date of Birth</label>
          <input type="date" name="dob" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Email</label>
          <input type="email" name="email" required class="w-full p-2 border rounded" />
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step hidden" id="step-2">
        <div class="mb-4">
          <label class="block mb-1 font-medium">Society Name</label>
          <input type="text" name="societyName" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Society Address</label>
          <input type="text" name="societyAddress" required class="w-full p-2 border rounded" />
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step hidden" id="step-3">
        <div class="mb-4">
          <label class="block mb-1 font-medium">Password</label>
          <input type="password" name="password" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Confirm Password</label>
          <input type="password" name="cpass" required class="w-full p-2 border rounded" />
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Address</label>
          <textarea name="fullAddress" required class="w-full p-2 border rounded" rows="3"></textarea>
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Security Question</label>
          <select name="securityQuestion" required class="w-full p-2 border rounded">
            <option value="" disabled selected>Select a question</option>
            <option>What is your favorite food?</option>
            <option>What was the name of your first pet?</option>
            <option>What is your mother's maiden name?</option>
            <option>What was your childhood nickname?</option>
          </select>
        </div>
        <div class="mb-4">
          <label class="block mb-1 font-medium">Your Answer</label>
          <input type="text" name="securityAnswer" required class="w-full p-2 border rounded" />
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="flex justify-between">
        <button type="button" onclick="prevStep()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-semibold py-2 px-4 rounded">
          Previous
        </button>
        <button type="button" onclick="nextStep()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
          Next
        </button>
        <button type="submit" id="submitBtn" class="hidden bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded">
          Register
        </button>
      </div>
    </form>
  </div>

  <script>
    const steps = document.querySelectorAll(".step");
    let currentStep = 0;
    function showStep(i) {
      steps.forEach((s,j)=> s.classList.toggle("hidden", j!==i));
      document.getElementById("submitBtn").classList.toggle("hidden", i!==steps.length-1);
    }
    function nextStep(){ if(currentStep<steps.length-1) showStep(++currentStep) }
    function prevStep(){ if(currentStep>0) showStep(--currentStep) }
    showStep(0);

    document.getElementById("registrationForm").addEventListener("submit", async e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      const res  = await fetch("/api/secretary", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(data)
      });
      const json = await res.json();
     if (res.ok) {
  alert(json.message || "Registered successfully!");
  window.location.href = "/seclogin";
} else {
  alert(json.error || "Registration failed");
}
    });
  </script>
</body>
</html>
