<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Multi-Step Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="flex flex-col md:flex-row bg-white rounded-lg shadow-lg max-w-5xl w-full overflow-hidden">

    <!-- Left Half: Image -->
    <div class="md:w-1/2 hidden md:flex justify-center items-center bg-gray-200">
      <img src="/images/reg image.png" 
           alt="Form Banner" 
           class="w-full h-full object-cover" />
    </div>

    <!-- Right Half: Form -->
    <div class="w-full md:w-1/2 p-8">
      <h2 class="text-2xl font-bold mb-6 text-center " id='header' >Register Society</h2>

      <form id="multiStepForm">
        <!-- Step 1 -->
        <div class="step" id="step-1">
          <div class="mb-4">
            <label class="block mb-1 font-medium">Seceratary Name</label>
            <input type="text" required class="w-full p-2 border rounded" />
          </div>

          <div class="mb-4">
            <label class="block mb-1 font-medium">Seceratary Phone</label>
            <input type="text"  required class="w-full p-2 border rounded" />
          </div>
          <div class="mb-4">

            <label class="block mb-1 font-medium">Date of Birth (Secratary)</label>
            <input type="date" required class="w-full p-2 border rounded" />
          </div>
        </div>

        <!-- Step 2 -->
        <div class="step hidden" id="step-2">
                    <div class="mb-4">
            <label class="block mb-1 font-medium">Society Email</label>
            <input type="email" required class="w-full p-2 border rounded" />
          </div>

          <div class="mb-4">

            <label class="block mb-1 font-medium">Society Name</label>
            <input type="text"  id="predefined" required class="w-full p-2 border rounded" />
          </div>
          <div class="mb-4">
            <label class="block mb-1 font-medium">Society Address </label>
            <input type="text" required class="w-full p-2 border rounded" />
          </div>
        </div>

        <!-- Step 3 -->
        <div class="step hidden" id="step-3">
          <div class="mb-4">
            <label class="block mb-1 font-medium">Password</label>
            <input type="password" required class="w-full p-2 border rounded" />
          </div>
          <div class="mb-4">
            <label class="block mb-1 font-medium">Confirm Password</label>
            <input type="password" required class="w-full p-2 border rounded" />
          </div>
          <div class="mb-4">
            <label class="block mb-1 font-medium">Address</label>
            <textarea class="w-full p-2 border rounded" rows="3"></textarea>
          </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between mt-6">
          <button type="button" id="prevBtn" class="bg-gray-400 text-white px-4 py-2 rounded disabled:opacity-50" disabled>
            Previous
          </button>
          <button type="button" id="nextBtn" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
            Next
          </button>
        </div>

      </form>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    
    const societyName = params.get("society");
    if (societyName){
    document.getElementById('predefined').value=societyName;
    document.getElementById('header').innerText=`Registring for ${societyName}`
    }
    const steps = document.querySelectorAll(".step");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");
    let currentStep = 0;
    
    function showStep(step) {
      steps.forEach((el, i) => {
        el.classList.toggle("hidden", i !== step);
      });
      prevBtn.disabled = step === 0;
      nextBtn.textContent = step === steps.length - 1 ? "Submit" : "Next";
    }

    nextBtn.addEventListener("click", () => {
        
      if (currentStep < steps.length - 1) {
        currentStep++;
        showStep(currentStep);
      } else {
  const inputs = document.querySelectorAll("input, textarea");
    
  const formData = {
    name: inputs[0].value,
    phone: inputs[1].value,
    dob: inputs[2].value,
    email: inputs[3].value,
    societyName: inputs[4].value,
    societyAddress: inputs[5].value,
    password: inputs[6].value,
    cpass: inputs[7].value,
    fullAddress: inputs[8].value,
  };
  if (
    !formData.name || !formData.email || !formData.phone || !formData.dob ||
    !formData.societyName || !formData.societyAddress ||
    !formData.password || !formData.cpass || !formData.fullAddress
) {
  alert("Please fill all the details");
}

    else{
  fetch("/api/secretary", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
    },
    body: JSON.stringify(formData),
  })
    .then((res) => res.json())
    .then((data) => {
      alert(data.message || "Saved Successfully");
    })
    .catch((err) => {
      alert("Something went wrong");
      console.error(err);
    });
}
      }

    });

    prevBtn.addEventListener("click", () => {
      if (currentStep > 0) {
        currentStep--;
        showStep(currentStep);
      }
    });

    showStep(currentStep); // Initialize
  </script>
</body>
</html>
